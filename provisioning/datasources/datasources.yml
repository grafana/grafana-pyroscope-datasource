apiVersion: 1

datasources:
  - name: 'pyroscope'
    uid: 'pyroscope-test'
    type: 'grafana-pyroscope-datasource'
    access: proxy
    url: 'http://pyroscope:4040'
    isDefault: false
    orgId: 1
    version: 1
    editable: true

  - name: 'pyroscope-cloud'
    uid: 'pyroscope-cloud'
    type: 'grafana-pyroscope-datasource'
    access: proxy
    url: $PYROSCOPE_CLOUD_URL
    basicAuth: true
    basicAuthUser: $PYROSCOPE_CLOUD_USER
    secureJsonData:
      basicAuthPassword: $PYROSCOPE_CLOUD_TOKEN
    isDefault: false
    orgId: 1
    version: 1
