# On older Grafana versions (11.x and earlier) `as_external` only applies when
# this feature toggle is enabled. The toggle has since been removed from core
# and `as_external` applies unconditionally. Kept so GRAFANA_VERSION overrides
# to older versions keep working.
[feature_toggles]
externalCorePlugins = true

# Skip the core-bundled copy of the plugin at discovery so the external build
# mounted from ./dist is the one Grafana loads.
[plugin.grafana-pyroscope-datasource]
as_external = true

[plugins]
allow_loading_unsigned_plugins = grafana-pyroscope-datasource
