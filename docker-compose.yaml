services:
  pyroscope:
    image: grafana/pyroscope:latest@sha256:8ade8d37ac58c20aca0054360fbcdef956a8242f48ad68e0ec67757f21d48e28
    pull_policy: missing
    ports:
      - 4040:4040

  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    depends_on:
      pyroscope:
        condition: service_started