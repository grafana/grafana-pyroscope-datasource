services:
  pyroscope:
    image: grafana/pyroscope:latest@sha256:881328cdbff0ef7601e23a0e7647fecb7099b4fe4c74fcdd204cb64722e2b2d0
    pull_policy: missing
    ports:
      - 4040:4040

  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    depends_on:
      pyroscope:
        condition: service_started