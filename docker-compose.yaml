services:
  pyroscope:
    image: grafana/pyroscope:latest
    pull_policy: missing
    ports:
      - 4040:4040

  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    depends_on:
      pyroscope:
        condition: service_started
    # Grafana images ship their own core-bundled copy of grafana-pyroscope-datasource,
    # and the plugin loader skips the copy mounted from ./dist as a duplicate
    # ("Skipping loading of plugin as it's a duplicate"). Mask the core copy so the
    # locally built plugin is the one Grafana loads, both locally and in CI e2e.
    tmpfs:
      - /usr/share/grafana/public/app/plugins/datasource/grafana-pyroscope-datasource
