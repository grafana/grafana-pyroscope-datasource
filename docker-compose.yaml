services:
  pyroscope:
    image: grafana/pyroscope:latest
    pull_policy: missing
    ports:
      - 4040:4040

  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    depends_on:
      pyroscope:
        condition: service_started
    environment:
      PYROSCOPE_CLOUD_URL: ${PYROSCOPE_CLOUD_URL:-}
      PYROSCOPE_CLOUD_USER: ${PYROSCOPE_CLOUD_USER:-}
      PYROSCOPE_CLOUD_TOKEN: ${PYROSCOPE_CLOUD_TOKEN:-}
