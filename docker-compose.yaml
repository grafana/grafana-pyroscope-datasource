services:
  pyroscope:
    image: grafana/pyroscope:latest@sha256:86a9ee7448487409ead8ada78789de7b78b739711b92b5d7224a1a54abf3eeb2
    pull_policy: missing
    ports:
      - 4040:4040

  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    depends_on:
      pyroscope:
        condition: service_started